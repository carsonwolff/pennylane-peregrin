[package]
name = "qbatch-core"
description = "Batched state-vector simulator for large batches of small (1 to 12 qubit) circuits"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
num-complex = "0.4"
num-traits = "0.2"
rayon = "1.10"

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "qbatch-bench"
path = "src/bin/bench.rs"
