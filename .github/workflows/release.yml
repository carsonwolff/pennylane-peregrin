# Build wheels for every platform plus an sdist, test them, and publish to PyPI.
#
# Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0) and can be started by
# hand from the Actions tab (workflow_dispatch), which builds and tests without publishing.
# Publishing uses PyPI trusted publishing: no API token is stored in the repository.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: wheel linux-${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --out dist -m crates/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist

  macos:
    name: wheel macos-${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m crates/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist

  windows:
    name: wheel windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist -m crates/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test:
    name: test ${{ matrix.wheel }} wheel
    needs: [linux, macos, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, wheel: linux-x86_64 }
          - { os: ubuntu-24.04-arm, wheel: linux-aarch64 }
          - { os: macos-latest, wheel: macos-aarch64 }
          - { os: windows-latest, wheel: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.wheel }}
          path: dist
      - name: Install the built wheel
        shell: bash
        run: python -m pip install pytest dist/*.whl
      - name: Run the device tests against default.qubit
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q ${{ github.workspace }}/crates/python/tests

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pennylane-peregrin/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ls dist
          ls dist | grep -q "pennylane_peregrin-${tag}" || { echo "tag v${tag} does not match the built version"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
