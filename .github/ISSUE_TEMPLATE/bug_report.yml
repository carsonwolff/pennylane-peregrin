name: Bug report
description: A wrong result, a crash, or an error that should not happen
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A wrong result is the most serious kind of bug here, so if
        peregrin disagrees with `default.qubit`, please include both outputs.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal example
      description: The smallest circuit or script that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, CPU, Python version, and the output of `python -c "import peregrin, pennylane; print(peregrin.__version__, pennylane.__version__)"`.
    validations:
      required: true
